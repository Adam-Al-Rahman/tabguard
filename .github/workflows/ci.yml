name: "tabguard_ci"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  validate:
    name: "Validate Codebase"
    runs-on: "ubuntu-latest"
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Install Rust Toolchain (nightly for fmt/miri)"
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: "rustfmt, miri, rust-src"

      - name: "Install Rust Toolchain (stable default)"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"

      - name: "Install Mold Linker"
        uses: rui314/setup-mold@v1

      - name: "Verify Formatting"
        run: cargo +nightly fmt --check

      - name: "Enforce Clippy Rules"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Install Build/Test Tools"
        uses: taiki-e/install-action@v2.87.21
        with:
          tool: nextest,cargo-audit

      - name: "Execute Tests"
        run: cargo nextest run

      - name: "Dependency Audit"
        run: cargo audit

      - name: "Secret Scanning (betterleaks)"
        run: |
          wget -qO- https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz | tar xz -C /usr/local/bin betterleaks
          betterleaks detect
