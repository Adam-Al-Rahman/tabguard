[package]
name = "tabguard"
version = "0.1.0"
edition = "2024"
description = "A Rust CLI for validating CSV datasets against declarative data-quality contracts."
license = "MIT"
repository = "https://github.com/Adam-Al-Rahman/tabguard"
homepage = "https://github.com/Adam-Al-Rahman/tabguard"
readme = "README.md"
keywords = ["csv", "data-quality", "validation", "cli"]
categories = ["command-line-utilities"]

[profile.dev]
incremental = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
