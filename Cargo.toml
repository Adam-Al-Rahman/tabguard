[package]
name = "tabguard"
version = "0.1.0"
edition = "2024"

[profile.dev]
incremental = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
